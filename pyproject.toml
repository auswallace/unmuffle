[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "unmuffle"
version = "0.3.0"
description = "Clean up bad audio and transcribe it: per-turn method search with an automatic judge, cleaned audio, per-speaker files, and a checked transcript."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
  "numpy>=1.24",
  "scipy>=1.10",
  "soundfile>=0.12",
  "sherpa-onnx>=1.12",
  "onnxruntime>=1.16",
]

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
unmuffle = "unmuffle.cli:main"

[tool.setuptools.packages.find]
include = ["unmuffle*"]

[tool.setuptools.package-data]
unmuffle = ["web/*.html"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]
ignore = ["E741", "B905", "SIM108"]

[tool.ruff.lint.per-file-ignores]
"examples/*" = ["E402"]

[tool.pytest.ini_options]
testpaths = ["tests"]
